extends: ./base.yaml
name: CI Auto-Heal
agents:
  audit:
    provider: openai
    model: gpt-5
  dev:
    provider: openai
    model: codex
steps:
  - id: audit
    agent: audit
    phase: verify
    prompt: ../prompts/audit.md
    inputs:
      - repo_context
      - git.diff
      - commands.log
    outputs:
      - output.json
  - id: fix
    agent: dev
    phase: repair
    prompt: ../prompts/fix.md
    inputs:
      - audit.json
      - git.diff
    outputs:
      - output.md
    apply_patch: true
    run:
      - npm test
