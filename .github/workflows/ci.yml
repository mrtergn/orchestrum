name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Core typecheck
        run: npm run -w @orchestrum/core typecheck
      - name: Core tests
        run: npm run -w @orchestrum/core test
      - name: Service build
        run: npm run -w @orchestrum/service build
      - name: UI lint
        run: npm run -w @orchestrum/ui lint
      - name: UI build
        run: npm run -w @orchestrum/ui build
