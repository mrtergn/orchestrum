name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ui/package-lock.json
      - name: Install
        run: npm run bootstrap
      - name: Core tests
        run: npm run test
      - name: Core and service typecheck
        run: npm run typecheck
      - name: UI lint
        run: npm run lint
      - name: UI build
        run: npm run build:ui
      - name: Desktop build
        run: npm run build:desktop
