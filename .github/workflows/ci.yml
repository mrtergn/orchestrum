name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: Runner target for manual runs
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  verify-self-hosted:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.event.inputs.runner_mode != 'github-hosted') }}
    # Set repo variable ORCHESTRUM_CI_RUNNER_LABELS_JSON to pin CI to a specific local runner.
    # Example: ["self-hosted", "macOS", "orchestrum"]
    runs-on: ${{ fromJSON(vars.ORCHESTRUM_CI_RUNNER_LABELS_JSON || '["self-hosted"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ui/package-lock.json
      - name: Install
        run: npm run bootstrap
      - name: Core tests
        run: npm run test
      - name: Core and service typecheck
        run: npm run typecheck
      - name: UI lint
        run: npm run lint
      - name: UI build
        run: npm run build:ui
      - name: Desktop build
        run: npm run build:desktop

  verify-fork-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ui/package-lock.json
      - name: Install
        run: npm run bootstrap
      - name: Core tests
        run: npm run test
      - name: Core and service typecheck
        run: npm run typecheck
      - name: UI lint
        run: npm run lint
      - name: UI build
        run: npm run build:ui
      - name: Desktop build
        run: npm run build:desktop

  verify-github-hosted:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner_mode == 'github-hosted' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ui/package-lock.json
      - name: Install
        run: npm run bootstrap
      - name: Core tests
        run: npm run test
      - name: Core and service typecheck
        run: npm run typecheck
      - name: UI lint
        run: npm run lint
      - name: UI build
        run: npm run build:ui
      - name: Desktop build
        run: npm run build:desktop
